[project]
name = "iterum"
version = "0.1.0"
description = "A Python harness for a fleet of coding agents, built on an append-only SQLite ledger."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fleet"
module-root = ""
namespace = true

[project.scripts]
iterum = "fleet.cli:main"
